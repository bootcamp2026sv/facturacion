spring.application.name=Facturacion

spring.datasource.url=jdbc:postgresql://207.58.175.220:5432/bootcamp
spring.datasource.username=keyjo
spring.datasource.password=keyjo2024
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA/Hibernate (opcional para desarrollo)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Ruta donde se servira la documentacion
springdoc.api-docs.path=/v3/api-docs
scalar.path=/scalar

# Tiempos de expiracion de Tokens JWT (en milisegundos)
# 60000 ms = 1 minuto
security.jwt.expiration-time=900000

# 300000 ms = 5 minutos (para probar el refresh token)
security.jwt.refresh-expiration-time=300000

# Habilitar soporte para recibir JSON tanto con mayusculas como minusculas (insensible a capitalizacion)
spring.jackson.mapper.accept-case-insensitive-properties=true

# Tema visual de Scalar (deepSpace da una estatica oscura premium)
scalar.theme=deepSpace

# CSS personalizado para una tipografia moderna, bordes redondeados suavizados y acento indigo
scalar.customCss=@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap'); :root { --scalar-font: 'Outfit', sans-serif; --scalar-radius: 8px; --scalar-color-accent: #6366f1; }
